# Six focus areas for the 2026 program. Every talk is shortlisted against one of these.
# Each track can be referenced from agenda.yaml and speakers via its `id`.

- id: ai-and-the-new-flow-of-work
  order: 1
  title: "AI and the New Flow of Work"
  description: "How AI changes the movement of work from idea to outcome — where cycle times drop, new bottlenecks emerge, and teams redesign hand-offs and decision-making to keep up."

- id: designing-human-agent-teams
  order: 2
  title: "Designing Human + Agent Teams"
  description: "How teams organise when AI becomes an embedded collaborator rather than a separate tool — what stays human, what goes agentic, and the new skills and roles that emerge."

- id: product-and-software-delivery-in-an-agentic-era
  order: 3
  title: "Product & Software Delivery in an Agentic Era"
  description: "Real implementations of AI across discovery, product management, engineering, quality, design and delivery — and what teams are learning when speed outpaces outcomes."

- id: finding-and-moving-the-bottleneck
  order: 4
  title: "Finding and Moving the Bottleneck"
  description: "How organisations find the true system constraint instead of just optimising one team or function — and what happens when production outruns governance and decision-making."

- id: from-throughput-to-value
  order: 5
  title: "From Throughput to Value"
  description: "How teams measure whether more speed, automation and output are actually creating value — and how they balance that against quality, learning and customer outcomes."

- id: leading-and-governing-the-agentic-enterprise
  order: 6
  title: "Leading & Governing the Agentic Enterprise"
  description: "The leadership and governance changes needed to introduce AI without losing flow, trust or accountability — new operating models, decision rights, and the cultural resistance teams run into along the way."
