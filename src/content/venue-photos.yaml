# Full-bleed venue carousel photos (from Scrum Day Nigeria 2025). Sources live in
# src/assets/venue/ — Astro resizes and converts them to WebP per screen size at build time.
# `focus` (CSS object-position) keeps people in frame when wide screens trim top/bottom.

- id: ballroom
  order: 1
  image: "../assets/venue/ballroom-wide.jpg"
  focus: "50% 70%"
  alt: "The chandeliered conference ballroom filled with attendees at round tables"

- id: audience-question
  order: 2
  image: "../assets/venue/audience-question.jpg"
  focus: "50% 65%"
  alt: "An attendee asking a question from the floor during a Scrum Day Nigeria session"

